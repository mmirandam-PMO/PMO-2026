name: Generar Portafolio SVG

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar constructor de imagen
        run: node generate.mjs

      - name: Guardar y subir portafolio.svg cambiado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add portafolio.svg
          git commit -m "🤖 portafolio.svg actualizado automáticamente" || exit 0
          git push
